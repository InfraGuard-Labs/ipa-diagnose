# Kerberos clock skew with THIS host's clock measured out of sync -> step the clock with chrony.
kind: procedure
id: proc.time.step-clock-with-chrony
title: Bring this host's clock back in sync with its time source
resolves:
  diagnosis: kerberos.clock-skew
  variant: local-desync
min_confidence: MEDIUM
bindings: {}
applies_to:
  freeipa_min: "4.9"
  freeipa_below: "5.0"
  roles: [ipa-server]
provenance:
  tier: FIXTURE_ONLY
  sources:
    - kind: upstream-docs
      ref: https://chrony-project.org/doc/4.5/chronyc.html
      title: "chronyc makestep: step the system clock immediately, correcting any offset"
    - kind: upstream-docs
      ref: https://web.mit.edu/kerberos/krb5-latest/doc/admin/conf_files/krb5_conf.html
      title: "MIT Kerberos clockskew (default 300 seconds)"
  verified_on: []
  reviews: []
  tests:
    - tests/resolution/test_procedures.py
investigate:
  - {id: root, check: host.privilege, params: {}, label: "Privileges"}
  - {id: chronyd, check: systemd.unit, params: {service: chronyd}, label: "chronyd service"}
  - {id: tracking, check: chrony.tracking, params: {}, label: "Clock offset of this host"}
  - {id: sources, check: chrony.sources, params: {}, label: "Time sources chronyd can reach"}
withhold_if:
  - when: {left: {ref: chronyd, field: active_state}, op: ne, right: active}
    reason: "chronyd is not running ({ref.chronyd.active_state}). Stepping the clock without it would not stay correct; start chronyd first (ipa-diagnose reports a stopped service as its own problem)."
  - when: {left: {ref: tracking, field: offset_seconds}, op: abs_lt, right: 240}
    reason: "This host's clock is {ref.tracking.offset_abs} s {ref.tracking.direction} its time source, well inside Kerberos' 300 s tolerance, so it cannot by itself explain a clock-skew error. Compare 'chronyc tracking' on the KDC and on the other machine; the wrong clock is probably there."
  - when: {left: {ref: tracking, field: synchronized}, op: is_false}
    reason: "chronyd has not synchronized with a time source (leap status {ref.tracking.leap_status}), so the time it would step to is not trustworthy. Fix NTP first."
  - when: {left: {ref: tracking, field: reference}, op: is_empty}
    reason: "chronyd reports no reference source, so the time it would step to is not trustworthy."
  - when: {left: {ref: tracking, field: offset_seconds}, op: abs_ge, right: 86400}
    reason: "The measured offset is more than a day ({ref.tracking.offset_abs} s). Stepping an IPA server's clock that far can make certificates look expired; confirm the time source is right before changing anything."
  - when: {left: {ref: sources, field: reachable}, op: lt, right: 1}
    reason: "No time source is reachable ({ref.sources.reachable} of {ref.sources.total}), so there is nothing trustworthy to set the clock to. Fix NTP server settings or network access first; ipa-diagnose has no deterministic fix for that."
prerequisites:
  - id: root
    text: "ipa-diagnose is running as root (stepping the clock needs root)"
    when: {left: {ref: root, field: is_root}, op: is_true}
  - id: accept-jump
    kind: confirm_by_admin
    text: "the clock on this server jumps once by about {ref.tracking.offset_abs} s (it is {ref.tracking.direction} {ref.tracking.reference}). Log entries and tickets around that moment may show odd times."
steps:
  - id: makestep
    text: "Step the clock to the time chronyd has measured as correct"
    run_on: local
    command: [chronyc, makestep]
    risk: MEDIUM
    changes: [time-resync]
    expected: "chronyc prints '200 OK'; 'chronyc tracking' then shows an offset close to 0"
what_changes:
  - text: "The system clock is stepped once by about {ref.tracking.offset_abs} s to match {ref.tracking.reference} (it is {ref.tracking.direction} it now). chronyd keeps it synchronized afterwards. Nothing else changes."
rollback:
  - text: "A clock step is not undone: it moves the clock to the correct time. Nothing else is changed, so there is nothing else to roll back."
verify:
  - text: "The clock offset is under 1 second"
    check: chrony.tracking
    params: {}
    when: {left: {ref: this, field: offset_seconds}, op: abs_lt, right: 1.0}
  - text: "chronyd reports the clock as synchronized"
    check: chrony.tracking
    params: {}
    when: {left: {ref: this, field: synchronized}, op: is_true}
limitations: "This fixes this host's clock only. Kerberos compares two clocks; if another machine's clock is wrong, fix it there. It does not explain why the clock drifted (for example a blocked NTP port)."
