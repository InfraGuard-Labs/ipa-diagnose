# Required service not running -> start exactly that systemd unit.
# Deliberately NOT `ipactl start`: if any IPA service fails to start, ipactl stops ALL IPA services
# (ipaserver/install/ipactl.py, unless --ignore-service-failures), which can take a partly working server down.
kind: procedure
id: proc.service.start-stopped-service
title: Start the stopped service
resolves:
  diagnosis: healthcheck.service-not-running
min_confidence: HIGH
bindings:
  service: {type: ipa_service}
applies_to:
  freeipa_min: "4.9"
  freeipa_below: "5.0"
  roles: [ipa-server]
provenance:
  tier: LIVE_VERIFIED
  sources:
    - kind: upstream-code
      ref: https://github.com/freeipa/freeipa-healthcheck/blob/master/src/ipahealthcheck/meta/services.py
      title: "ipa-healthcheck service checks report '<service>: not running'"
    - kind: upstream-code
      ref: https://github.com/freeipa/freeipa/blob/master/ipaserver/install/ipactl.py
      title: "ipactl start stops all IPA services when one fails to start - why this procedure starts the single unit"
  verified_on:
    - freeipa: "4.13.3"
      os: fedora-43
      tier: LIVE
      evidence: https://github.com/InfraGuard-Labs/ipa-diagnose/actions/runs/36258032392
      date: "2026-09-26"
  reviews:
    - by: "fresh reviewer agents that did not implement Slice 1 (independent within a one-maintainer project), rounds 1-10, red teams 1-8"
      date: "2026-09-24"
      scope: "adversarial rounds 1-10 and red teams 1-8 plus a final truth review: tried to make ipa-diagnose offer a wrong or unsafe procedure or report a false RESOLVED; all blockers fixed and regression-tested"
      independent: true
  tests:
    - tests/resolution/test_procedures.py
    - tests/resolution/test_round3_regressions.py
investigate:
  - {id: root, check: host.privilege, params: {}, label: "Privileges"}
  - {id: unit, check: systemd.unit, params: {service: {bind: service}}, label: "State of {bind.service}"}
  - {id: journal, check: systemd.journal_tail, params: {unit: {ref: unit, field: unit}}, label: "Recent log of {ref.unit.unit}"}
withhold_if:
  - when: {left: {ref: unit, field: load_state}, op: eq, right: masked}
    reason: "{ref.unit.unit} is masked: someone disabled it on purpose. ipa-diagnose will not suggest unmasking it; find out why it was masked first."
  - when: {left: {ref: unit, field: load_state}, op: ne, right: loaded}
    reason: "{ref.unit.unit} is not a loaded unit on this host (load state {ref.unit.load_state}), so it cannot simply be started."
  - when: {left: {ref: unit, field: active_state}, op: eq, right: active}
    reason: "{ref.unit.unit} is running now (checked just now), so there is nothing to start. Run ipa-diagnose again to refresh the findings."
  - when: {left: {ref: unit, field: active_state}, op: in, right: [activating, deactivating, reloading]}
    reason: "{ref.unit.unit} is currently {ref.unit.active_state}. Wait for it to settle, then run ipa-diagnose again."
  - when:
      all:
        - {left: {ref: unit, field: start_method}, op: eq, right: systemctl}
        - {left: {ref: unit, field: unit_file_state}, op: eq, right: disabled}
    reason: "{ref.unit.unit} is disabled in systemd, which may be intentional. ipa-diagnose will not start a disabled service; check why it was disabled first."
prerequisites:
  - id: root
    text: "ipa-diagnose is running as root (starting a system service needs root)"
    when: {left: {ref: root, field: is_root}, op: is_true}
steps:
  - id: start-unit
    text: "Start only {ref.unit.unit}; no other service is started or stopped"
    run_on: local
    command: [systemctl, start, {ref: unit, field: unit, type: systemd_unit}]
    risk: MEDIUM
    changes: [service-start]
    expected: "the command returns without an error and {ref.unit.unit} is active. If it fails, it stays stopped and systemctl status shows why"
what_changes:
  - text: "{ref.unit.unit} goes from {ref.unit.active_state} to running. No configuration, data or other service is changed."
rollback:
  - text: "Stop it again (back to the state it was in)"
    command: [systemctl, stop, {ref: unit, field: unit, type: systemd_unit}]
verify:
  - text: "{ref.unit.unit} is active"
    check: systemd.unit
    params: {service: {bind: service}}
    when: {left: {ref: this, field: active_state}, op: eq, right: active}
limitations: "This starts the one stopped service; it does not establish why it stopped. If it stopped because of a failure (see the last result and log line above), the same cause can stop it again. ipactl start is deliberately not used: if any IPA service fails to start, ipactl stops all IPA services."
