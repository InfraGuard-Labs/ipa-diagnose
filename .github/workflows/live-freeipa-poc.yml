name: Live FreeIPA lab - environment proof of concept

# Manually triggered only - never runs on push/PR. Purpose: prove whether a
# GitHub-hosted runner can actually boot systemd AND complete a real
# ipa-server-install inside a freeipa/freeipa-server container, before
# building a full live-validation lab around that assumption. Docker
# Desktop on the developer's own machine was already tried twice and
# failed on cgroup v1/systemd itself. This runner environment has cgroup
# v2 (confirmed in an earlier PoC run) - this run tests the full,
# correctly-configured install per the upstream freeipa-container project's
# own documented invocation (https://github.com/freeipa/freeipa-container).
on:
  workflow_dispatch: {}

jobs:
  poc:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Report host cgroup/systemd environment
        run: |
          docker info 2>&1 | grep -iE "cgroup|storage driver" || true
          systemctl --version || true

      - name: Boot a real FreeIPA server (unattended install)
        run: |
          docker volume create ipa-poc-data
          docker pull freeipa/freeipa-server:fedora-43
          docker run -d --name poc-ipa \
            --privileged \
            --cgroupns=host \
            -v /sys/fs/cgroup:/sys/fs/cgroup:rw \
            -v ipa-poc-data:/data \
            -h ipa01.poc.test \
            -e PASSWORD=PocLabSecret123 \
            -e DEBUG_TRACE=1 \
            -e DEBUG_NO_EXIT=1 \
            freeipa/freeipa-server:fedora-43 \
            ipa-server-install -U -r POC.TEST --no-ntp --skip-mem-check
          echo "Container started, polling for install completion (up to 12 minutes)..."
          for i in $(seq 1 72); do
            sleep 10
            LOGS=$(docker logs poc-ipa 2>&1)
            if echo "$LOGS" | grep -q "The ipa-server-install command was successful"; then
              echo "INSTALL SUCCEEDED after ~$((i*10))s"
              break
            fi
            if echo "$LOGS" | grep -q "FreeIPA server configuration failed"; then
              echo "INSTALL FAILED after ~$((i*10))s (see log below)"
              break
            fi
            STATUS=$(docker inspect -f '{{.State.Status}}' poc-ipa 2>/dev/null || echo "gone")
            if [ "$STATUS" != "running" ]; then
              echo "Container status changed to '$STATUS' after ~$((i*10))s"
              break
            fi
            echo "  [$((i*10))s] still installing (container running)"
          done

      - name: Check final state
        if: always()
        run: |
          echo "--- container status ---"
          docker ps -a --filter "name=poc-ipa"
          echo "--- systemd status (if still running) ---"
          docker exec poc-ipa systemctl is-system-running 2>&1 || true
          echo "--- last 200 lines of container output ---"
          docker logs poc-ipa --tail 200 2>&1
          echo "--- ipa-server-install.log tail (if present) ---"
          docker exec poc-ipa tail -100 /var/log/ipaserver-install.log 2>&1 || echo "(log not accessible)"

      - name: Live ipa-healthcheck test (only if install succeeded)
        if: always()
        run: |
          if docker logs poc-ipa 2>&1 | grep -q "The ipa-server-install command was successful"; then
            echo "Running real ipa-healthcheck on the live server..."
            docker exec poc-ipa ipa-healthcheck --output-type json > /tmp/healthcheck.json 2>&1 || true
            echo "--- healthcheck output (first 100 lines) ---"
            head -100 /tmp/healthcheck.json
          else
            echo "Skipping - install did not succeed."
          fi

      - name: Cleanup
        if: always()
        run: |
          docker rm -f poc-ipa 2>/dev/null || true
          docker volume rm ipa-poc-data 2>/dev/null || true
