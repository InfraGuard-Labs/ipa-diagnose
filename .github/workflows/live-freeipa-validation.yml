name: Live FreeIPA validation lab

# Manually triggered only - never runs on push/PR. This is the real
# validation lab: it installs the PUBLIC ipa-diagnose v0.1.1 artifact
# (from production PyPI, per the "public artifact first" rule - not
# built from source) against real, live FreeIPA servers running on
# GitHub-hosted runners (proven viable in live-freeipa-poc.yml - real
# cgroup v2, real systemd, real ipa-server-install completing in ~4
# minutes). Each job is independent and gets its own fresh runner/VM,
# so they run in parallel with no shared-resource contention.
#
# Every scenario's evidence (sanitized) is uploaded as a workflow
# artifact for later inspection and potential conversion into regression
# fixtures. Nothing here writes to any real/production FreeIPA
# infrastructure - every server is created and destroyed within the job.
permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      install_source:
        description: "Where to install ipa-diagnose from: 'pypi' (public artifact, default, per the public-artifact-first rule) or 'source' (this exact checked-out commit - only for retesting a not-yet-released fix before it's published)"
        required: false
        default: "pypi"

env:
  INSTALL_SOURCE: ${{ inputs.install_source }}
  IPA_PASSWORD: LiveLabSecret123

jobs:
  # ---------------------------------------------------------------------
  # Baseline: one healthy server, public v0.1.1 via pipx, real
  # ipa-healthcheck, real ipa-diagnose. This is Part 6 of the master
  # prompt - the foundational "healthy must not fabricate" proof.
  # ---------------------------------------------------------------------
  baseline-healthy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Record environment
        run: |
          echo "=== Host environment ===" | tee env-report.txt
          uname -a | tee -a env-report.txt
          docker info 2>&1 | grep -iE "cgroup|storage driver" | tee -a env-report.txt

      - name: Boot a real FreeIPA server
        run: |
          docker volume create ipa-data
          docker pull freeipa/freeipa-server:fedora-43
          docker run -d --name ipa-primary \
            --privileged --cgroupns=host \
            -v /sys/fs/cgroup:/sys/fs/cgroup:rw \
            -v ipa-data:/data \
            -h ipa01.lab.test \
            -e PASSWORD=${IPA_PASSWORD} \
            freeipa/freeipa-server:fedora-43 \
            ipa-server-install -U -r LAB.TEST --no-ntp --skip-mem-check --setup-dns --auto-forwarders --auto-reverse
          echo "Polling for install completion..."
          for i in $(seq 1 90); do
            sleep 10
            if docker exec ipa-primary systemctl is-active ipa.service 2>/dev/null | grep -qx active; then
              echo "IPA service active after ~$((i*10))s - waiting 20s extra settle time"; sleep 20; break
            fi
            if [ $i -eq 90 ]; then echo "TIMEOUT waiting for install"; fi
          done
          docker exec ipa-primary cat /var/log/ipaserver-install.log > baseline-ipaserver-install.log 2>&1 || true
          tail -30 baseline-ipaserver-install.log

      - name: Record exact software versions
        run: |
          echo "=== FreeIPA / ipa-healthcheck / 389-DS / Python versions ===" | tee -a env-report.txt
          docker exec ipa-primary rpm -q freeipa-server freeipa-healthcheck 389-ds-base python3 2>&1 | tee -a env-report.txt
          docker exec ipa-primary cat /etc/os-release | tee -a env-report.txt

      - name: Install public ipa-diagnose v0.1.1 (pipx, production PyPI) INSIDE the FreeIPA container
        run: |
          docker exec ipa-primary bash -c "
            set -e
            for attempt in 1 2 3; do
              dnf install -y python3-pip && break
              echo \"dnf install python3-pip attempt \$attempt failed, retrying in 15s...\"
              sleep 15
            done
            python3 -m pip install pipx
            python3 -m pipx install ipa-diagnose
            /root/.local/bin/ipa-diagnose --version
          " | tee -a env-report.txt

      - name: Real ipa-healthcheck + real ipa-diagnose on the healthy server
        run: |
          echo "=== ipa-healthcheck (real) ===" | tee healthy-healthcheck.json
          docker exec ipa-primary ipa-healthcheck --output-type json > healthy-healthcheck.json 2>&1 || true
          cat healthy-healthcheck.json
          echo "=== ipa-diagnose (real, public v0.1.1, live) ===" | tee healthy-diagnose-output.txt
          docker exec ipa-primary /root/.local/bin/ipa-diagnose --details > healthy-diagnose-output.txt 2>&1 || true
          cat healthy-diagnose-output.txt
          echo "=== ipa-diagnose --json ===" | tee healthy-diagnose.json
          docker exec ipa-primary /root/.local/bin/ipa-diagnose --json > healthy-diagnose.json 2>&1 || true
          cat healthy-diagnose.json

      - name: Repeat 3x to check for nondeterminism/false positives on a healthy server
        run: |
          for n in 1 2 3; do
            echo "=== Run $n ===" >> healthy-repeat-runs.txt
            docker exec ipa-primary /root/.local/bin/ipa-diagnose >> healthy-repeat-runs.txt 2>&1 || true
            echo "" >> healthy-repeat-runs.txt
          done
          cat healthy-repeat-runs.txt

      - name: Probe least-privilege RUV evidence (root LDAPI EXTERNAL - no Directory Manager password)
        run: |
          # Research question: can stale-RUV evidence be read WITHOUT the DM
          # password? Compare (1) ipa-replica-manage list-ruv with an admin
          # ticket, (2) a read-only LDAPI EXTERNAL search as root (the
          # mechanism ipa-healthcheck's RUV check uses), (3) ipa server-find.
          docker exec ipa-primary bash -c "echo '${IPA_PASSWORD}' | kinit admin" || true
          echo "=== (1) ipa-replica-manage list-ruv with admin ticket ===" | tee ruv-probe.txt
          docker exec ipa-primary bash -c "ipa-replica-manage list-ruv < /dev/null" >> ruv-probe.txt 2>&1 || true
          echo "=== (2) LDAPI EXTERNAL read-only search of the RUV tombstone as root ===" | tee -a ruv-probe.txt
          docker exec ipa-primary ldapsearch -LLL -Y EXTERNAL -H ldapi://%2Frun%2Fslapd-LAB-TEST.socket -b "dc=lab,dc=test" "(&(nsuniqueid=ffffffff-ffffffff-ffffffff-ffffffff)(objectclass=nstombstone))" nsds50ruv >> ruv-probe.txt 2>&1 || true
          echo "=== (2b) same search over GSSAPI with the admin ticket ===" | tee -a ruv-probe.txt
          docker exec ipa-primary ldapsearch -LLL -Y GSSAPI -H ldap://ipa01.lab.test -b "dc=lab,dc=test" "(&(nsuniqueid=ffffffff-ffffffff-ffffffff-ffffffff)(objectclass=nstombstone))" nsds50ruv >> ruv-probe.txt 2>&1 || true
          echo "--- ipa-primary: (a) root LDAPI EXTERNAL, base-scoped read of the RUV tombstone entry ---" | tee -a ruv-probe.txt
          docker exec ipa-primary ldapsearch -LLL -Y EXTERNAL -H ldapi://%2Frun%2Fslapd-LAB-TEST.socket -b "nsuniqueid=ffffffff-ffffffff-ffffffff-ffffffff,dc=lab,dc=test" -s base "(objectclass=*)" nsds50ruv >> ruv-probe.txt 2>&1 || true
          echo "--- ipa-primary: (b) root LDAPI EXTERNAL, subtree search with the nsTombstone filter ---" | tee -a ruv-probe.txt
          docker exec ipa-primary ldapsearch -LLL -Y EXTERNAL -H ldapi://%2Frun%2Fslapd-LAB-TEST.socket -b "dc=lab,dc=test" -s sub "(&(nsuniqueid=ffffffff-ffffffff-ffffffff-ffffffff)(objectClass=nsTombstone))" nsds50ruv >> ruv-probe.txt 2>&1 || true
          echo "--- ipa-primary: (c) GSSAPI as admin, base-scoped read ---" | tee -a ruv-probe.txt
          docker exec ipa-primary ldapsearch -LLL -Y GSSAPI -H ldap://$(docker exec ipa-primary hostname -f) -b "nsuniqueid=ffffffff-ffffffff-ffffffff-ffffffff,dc=lab,dc=test" -s base "(objectclass=*)" nsds50ruv >> ruv-probe.txt 2>&1 || true
          echo "=== (2c) LDAPI whoami as root (which identity does EXTERNAL map to?) ===" | tee -a ruv-probe.txt
          docker exec ipa-primary ldapwhoami -Y EXTERNAL -H ldapi://%2Frun%2Fslapd-LAB-TEST.socket >> ruv-probe.txt 2>&1 || true
          echo "=== (2d) CONTROL: same tombstone search bound as cn=Directory Manager (lab-owned throwaway credential; proves the RUV entry exists and what the filter should return) ===" | tee -a ruv-probe.txt
          docker exec ipa-primary ldapsearch -LLL -x -D "cn=Directory Manager" -w "${IPA_PASSWORD}" -H ldap://ipa01.lab.test -b "dc=lab,dc=test" "(&(nsuniqueid=ffffffff-ffffffff-ffffffff-ffffffff)(objectclass=nstombstone))" nsds50ruv >> ruv-probe.txt 2>&1 || true
          echo "=== (2e) root EXTERNAL, broader filter incl. tombstones ===" | tee -a ruv-probe.txt
          docker exec ipa-primary ldapsearch -LLL -Y EXTERNAL -H ldapi://%2Frun%2Fslapd-LAB-TEST.socket -b "dc=lab,dc=test" -s one "(objectclass=nstombstone)" dn nsds50ruv >> ruv-probe.txt 2>&1 || true
          echo "=== (3) ipa server-find ===" | tee -a ruv-probe.txt
          docker exec ipa-primary ipa server-find >> ruv-probe.txt 2>&1 || true
          cat ruv-probe.txt

      - name: Cleanup
        if: always()
        run: docker rm -f ipa-primary 2>/dev/null || true; docker volume rm ipa-data 2>/dev/null || true

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baseline-healthy-evidence
          path: |
            env-report.txt
            baseline-ipaserver-install.log
            healthy-healthcheck.json
            healthy-diagnose-output.txt
            healthy-diagnose.json
            healthy-repeat-runs.txt
            ruv-probe.txt
          retention-days: 30

  # ---------------------------------------------------------------------
  # HIGHEST PRIORITY (Part 8): live stale-RUV / removed-replica scenario.
  # Two-node topology, prove healthy replication first, then remove one
  # replica ungracefully to produce genuine stale RUV metadata while the
  # rest of the topology looks otherwise healthy - the exact scenario the
  # real external user reported and v0.1.1 was built to fix.
  # ---------------------------------------------------------------------
  stale-ruv-live:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      # Only needed for install_source=source (retesting an unreleased fix);
      # the default pypi path never touches the checkout.
      - uses: actions/checkout@v4

      - name: Boot primary (Server A)
        run: |
          docker network create --subnet 172.30.0.0/24 ipa-net
          docker volume create ipa-a-data
          docker pull freeipa/freeipa-server:fedora-43
          docker run -d --name ipa-a --network ipa-net --ip 172.30.0.10 \
            --privileged --cgroupns=host \
            -v /sys/fs/cgroup:/sys/fs/cgroup:rw \
            -v ipa-a-data:/data \
            -h ipa-a.ruvlab.test \
            -e PASSWORD=${IPA_PASSWORD} \
            freeipa/freeipa-server:fedora-43 \
            ipa-server-install -U -r RUVLAB.TEST --no-ntp --skip-mem-check --setup-dns --auto-forwarders --auto-reverse
          echo "Polling Server A install..."
          for i in $(seq 1 90); do
            sleep 10
            if docker exec ipa-a systemctl is-active ipa.service 2>/dev/null | grep -qx active; then echo "A ready after ~$((i*10))s - waiting 20s extra settle time"; sleep 20; break; fi
          done
          docker exec ipa-a cat /var/log/ipaserver-install.log > server-a-install.log 2>&1 || true

      - name: Boot replica (Server B) and join to Server A
        run: |
          # Root cause of earlier Server B rollbacks: 'Preferred host
          # ipa-b.ruvlab.test does not provide DNS' - the replica must be
          # able to resolve itself and the realm via the IPA DNS on A.
          docker exec ipa-a bash -c "echo '${IPA_PASSWORD}' | kinit admin && ipa dnsrecord-add ruvlab.test ipa-b --a-rec 172.30.0.11"
          # Root cause (real ipareplica-install.log): ipa-replica-conncheck makes
          # Server A connect back to the replica and A could not resolve
          # ipa-b.ruvlab.test (A uses Docker's resolver, not IPA DNS).
          docker exec ipa-a bash -c "echo '172.30.0.11 ipa-b.ruvlab.test ipa-b' >> /etc/hosts"
          docker exec ipa-a getent hosts ipa-b.ruvlab.test
          docker volume create ipa-b-data
          docker run -d --name ipa-b --network ipa-net --ip 172.30.0.11 --dns 172.30.0.10 \
            --privileged --cgroupns=host \
            -v /sys/fs/cgroup:/sys/fs/cgroup:rw \
            -v ipa-b-data:/data \
            -h ipa-b.ruvlab.test \
            --add-host ipa-a.ruvlab.test:$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' ipa-a) \
            -e PASSWORD=${IPA_PASSWORD} \
            freeipa/freeipa-server:fedora-43 \
            ipa-replica-install -U --no-host-dns --server=ipa-a.ruvlab.test --domain=ruvlab.test --realm=RUVLAB.TEST --principal=admin --admin-password=${IPA_PASSWORD} --no-ntp --skip-mem-check
          echo "Polling Server B install..."
          for i in $(seq 1 120); do
            sleep 10
            if [ "$(docker inspect -f '{{.State.Running}}' ipa-b 2>/dev/null)" != "true" ]; then
              echo "::error::Server B container exited during replica install - capturing why"
              docker logs ipa-b > server-b-container.log 2>&1 || true
              tail -60 server-b-container.log
              # The real installer log lives on the /data volume of the exited container.
              docker run --rm -v ipa-b-data:/data alpine sh -c 'cat /data/var/log/ipareplica-install.log 2>/dev/null || find /data -name "ipareplica-install.log" 2>/dev/null' > server-b-install.log 2>&1 || true
              echo "=== first ERROR/Traceback lines in the replica install log ==="
              grep -n -i -m 15 "ERROR\|Traceback\|ScriptError\|CalledProcessError\|cannot\|failed" server-b-install.log | cut -c1-300 || true
              echo "=== last 40 lines ==="
              tail -40 server-b-install.log | cut -c1-300
              exit 1
            fi
            if docker exec ipa-b systemctl is-active ipa.service 2>/dev/null | grep -qx active; then echo "B ready after ~$((i*10))s - waiting 20s extra settle time"; sleep 20; READY=1; break; fi
          done
          if [ "${READY:-0}" != "1" ]; then echo "::error::Server B never became ready"; docker logs ipa-b > server-b-container.log 2>&1 || true; tail -60 server-b-container.log; exit 1; fi
          docker exec ipa-b cat /var/log/ipareplica-install.log > server-b-install.log 2>&1 || true
          tail -40 server-b-install.log

      - name: Authenticate as admin (ipa-replica-manage needs a real ticket, not just root)
        run: |
          # Without an active Kerberos ticket, ipa-replica-manage falls
          # back to interactively prompting for the Directory Manager
          # password, which fails headlessly here ("Directory Manager
          # password required", confirmed in an earlier run of this same
          # job). A real admin ticket is what a real administrator would
          # actually have when running these commands, so this matches
          # real usage, not a workaround.
          docker exec ipa-a bash -c "echo '${IPA_PASSWORD}' | kinit admin"
          docker exec ipa-a klist

      - name: Prove healthy replication BEFORE injecting any failure
        run: |
          echo "=== Server A: healthcheck (healthy baseline) ===" | tee healthy-topology-healthcheck-A.json
          docker exec ipa-a ipa-healthcheck --output-type json > healthy-topology-healthcheck-A.json 2>&1 || true
          echo "=== Server A: ipa-replica-manage list ===" | tee healthy-topology-list-A.txt
          docker exec ipa-a ipa-replica-manage list > healthy-topology-list-A.txt 2>&1 || true
          echo "=== Server A: list-ruv (both replicas alive) ===" | tee healthy-topology-list-ruv-A.txt
          docker exec ipa-a ipa-replica-manage list-ruv > healthy-topology-list-ruv-A.txt 2>&1 || true
          cat healthy-topology-list-ruv-A.txt

      - name: Report runner resource headroom (two FreeIPA servers on one runner)
        run: free -h; df -h /

      - name: Install public v0.1.1 on Server A and confirm HEALTHY on the healthy topology
        run: |
          # Server A's own just-installed DNS (--setup-dns) is now this
          # container's resolver, and its upstream forwarding is not
          # reliably resolving public names on this custom Docker network
          # (confirmed: "Temporary failure in name resolution" installing
          # from PyPI/Fedora mirrors, right after a topology install that
          # worked fine on the single-server/default-network baseline job).
          # This step only needs to reach PyPI/Fedora's own mirrors, not
          # resolve anything IPA-specific, so it temporarily points
          # resolution at a public resolver rather than fighting with
          # FreeIPA's own DNS setup - the actual test scenario later in
          # this job never depends on this container's public DNS working.
          docker exec ipa-a cp /etc/resolv.conf /etc/resolv.conf.ipa-backup
          docker exec ipa-a bash -c "echo 'nameserver 1.1.1.1' > /etc/resolv.conf; echo 'nameserver 8.8.8.8' >> /etc/resolv.conf"
          docker exec ipa-a bash -c "
            set -e
            for attempt in 1 2 3; do
              dnf install -y python3-pip git && break
              echo \"dnf install python3-pip attempt \$attempt failed, retrying in 15s...\"
              sleep 15
            done
            python3 -m pip install pipx
          "
          if [ "$INSTALL_SOURCE" = "source" ]; then
            echo "Installing ipa-diagnose from THIS checked-out commit (${{ github.sha }}) - NOT the public PyPI artifact. Only for retesting a not-yet-released fix."
            docker cp "$GITHUB_WORKSPACE" ipa-a:/ipa-diagnose-source
            docker exec ipa-a bash -c "python3 -m pipx install /ipa-diagnose-source"
          else
            docker exec ipa-a bash -c "python3 -m pipx install ipa-diagnose"
          fi
          # Restore Server A's own DNS resolver immediately - every step
          # after this one needs to resolve ipa-a.ruvlab.test/ipa-b.ruvlab.test
          # via IPA's own DNS, not public resolvers (confirmed in an
          # earlier run: leaving the public-resolver override in place
          # broke `ipa-replica-manage`'s own hostname resolution for the
          # rest of the job).
          docker exec ipa-a cp /etc/resolv.conf.ipa-backup /etc/resolv.conf
          docker exec ipa-a /root/.local/bin/ipa-diagnose --details | tee healthy-topology-diagnose-A.txt || true

      - name: Probe RUV read access on the real two-node topology (BEFORE failure)
        run: |
          echo "=== BEFORE removal ===" | tee ruv-ldapi-probe-before.txt
          echo "--- ipa-a: (a) root LDAPI EXTERNAL, base-scoped read of the RUV tombstone entry ---" | tee -a ruv-ldapi-probe-before.txt
          docker exec ipa-a ldapsearch -LLL -Y EXTERNAL -H ldapi://%2Frun%2Fslapd-RUVLAB-TEST.socket -b "nsuniqueid=ffffffff-ffffffff-ffffffff-ffffffff,dc=ruvlab,dc=test" -s base "(objectclass=*)" nsds50ruv >> ruv-ldapi-probe-before.txt 2>&1 || true
          echo "--- ipa-a: (b) root LDAPI EXTERNAL, subtree search with the nsTombstone filter ---" | tee -a ruv-ldapi-probe-before.txt
          docker exec ipa-a ldapsearch -LLL -Y EXTERNAL -H ldapi://%2Frun%2Fslapd-RUVLAB-TEST.socket -b "dc=ruvlab,dc=test" -s sub "(&(nsuniqueid=ffffffff-ffffffff-ffffffff-ffffffff)(objectClass=nsTombstone))" nsds50ruv >> ruv-ldapi-probe-before.txt 2>&1 || true
          echo "--- ipa-a: (c) GSSAPI as admin, base-scoped read ---" | tee -a ruv-ldapi-probe-before.txt
          docker exec ipa-a ldapsearch -LLL -Y GSSAPI -H ldap://$(docker exec ipa-a hostname -f) -b "nsuniqueid=ffffffff-ffffffff-ffffffff-ffffffff,dc=ruvlab,dc=test" -s base "(objectclass=*)" nsds50ruv >> ruv-ldapi-probe-before.txt 2>&1 || true
          cat ruv-ldapi-probe-before.txt

      - name: Inject the failure - ungracefully remove Server B (decommission without clean del)
        run: |
          # Simulates "old replica information that remained after systems
          # were gone" - the real external user's reported scenario: stop
          # and remove the replica container directly, WITHOUT running
          # `ipa-replica-manage del`/`ipa server-del` first, leaving stale
          # RUV metadata behind on the survivor.
          docker rm -f ipa-b 2>/dev/null || true
          echo "Server B forcibly removed. Waiting 60s for A's own state to settle..."
          sleep 60

      - name: Capture the dead-but-still-registered state (B unreachable, still in topology)
        run: |
          docker exec ipa-a ipa-replica-manage list > stale-ruv-registered-list-A.txt 2>&1 || true
          docker exec ipa-a ipa-healthcheck --output-type json > stale-ruv-registered-healthcheck-A.json 2>&1 || true
          docker exec ipa-a /root/.local/bin/ipa-diagnose --details > stale-ruv-registered-diagnose-A.txt 2>&1 || true
          docker exec ipa-a /root/.local/bin/ipa-diagnose --json > stale-ruv-registered-diagnose-A.json 2>&1 || true
          cat stale-ruv-registered-list-A.txt; head -30 stale-ruv-registered-diagnose-A.txt

      - name: Decommission B from the topology WITHOUT cleaning its RUV (lab-only, admin ticket)
        run: |
          # Lab-only mutation on a throwaway server: remove ipa-b from the
          # topology/masters so that its RUV element (if it survives) has NO
          # corresponding live server = a genuine stale RUV. ipa-diagnose
          # itself never performs any of this.
          docker exec ipa-a bash -c "echo '${IPA_PASSWORD}' | kinit admin" || true
          # Real output shapes of the commands the collector runs:
          docker exec ipa-a ipa-replica-manage list ipa-a.ruvlab.test > stale-ruv-list-host-shape.txt 2>&1 || true
          docker exec ipa-a ipa-replica-manage list -v ipa-a.ruvlab.test >> stale-ruv-list-host-shape.txt 2>&1 || true
          cat stale-ruv-list-host-shape.txt
          # `ipa server-del` was proven (real lab run) to clean the RUV itself,
          # so it cannot create a stale RUV. Engineer the state an unclean
          # decommission leaves behind: remove ipa-b's master registration and
          # topology segments directly (lab-only, root LDAPI) but leave the
          # replica update vector element alone.
          SOCK='ldapi://%2Frun%2Fslapd-RUVLAB-TEST.socket'
          BASE='dc=ruvlab,dc=test'
          {
            echo "--- segments mentioning ipa-b ---"
            docker exec ipa-a ldapsearch -LLL -Y EXTERNAL -H "$SOCK" -b "cn=topology,cn=ipa,cn=etc,$BASE" "(|(ipaReplTopoSegmentLeftNode=ipa-b.ruvlab.test)(ipaReplTopoSegmentRightNode=ipa-b.ruvlab.test))" dn 2>&1 | grep -i '^dn:' | sed 's/^dn: //' > /tmp/segs.txt || true
            cat /tmp/segs.txt
            while read -r dn; do [ -n "$dn" ] && docker exec ipa-a ldapdelete -Y EXTERNAL -H "$SOCK" "$dn" 2>&1; done < /tmp/segs.txt || true
            echo "--- delete master registration (recursive) ---"
            docker exec ipa-a ldapdelete -r -Y EXTERNAL -H "$SOCK" "cn=ipa-b.ruvlab.test,cn=masters,cn=ipa,cn=etc,$BASE" 2>&1 || true
          } > stale-ruv-server-del.txt 2>&1
          cat stale-ruv-server-del.txt
          sleep 30
          echo "=== list after server-del ===" | tee stale-ruv-list-after-del.txt
          docker exec ipa-a ipa-replica-manage list >> stale-ruv-list-after-del.txt 2>&1 || true
          cat stale-ruv-list-after-del.txt

      - name: Capture REAL post-removal evidence on the survivor (Server A)
        run: |
          echo "=== ipa-healthcheck after B's removal ===" | tee stale-ruv-healthcheck-A.json
          docker exec ipa-a ipa-healthcheck --output-type json > stale-ruv-healthcheck-A.json 2>&1 || true
          cat stale-ruv-healthcheck-A.json
          echo "=== ipa-replica-manage list (B should be gone/unreachable) ===" | tee stale-ruv-list-A.txt
          docker exec ipa-a ipa-replica-manage list > stale-ruv-list-A.txt 2>&1 || true
          cat stale-ruv-list-A.txt
          echo "=== ipa-replica-manage list-ruv (THE critical evidence) ===" | tee stale-ruv-list-ruv-A.txt
          docker exec ipa-a ipa-replica-manage list-ruv > stale-ruv-list-ruv-A.txt 2>&1 || true
          cat stale-ruv-list-ruv-A.txt

      - name: Probe RUV read access AFTER Server B's ungraceful removal (stale metadata present)
        run: |
          echo "=== AFTER removal ===" | tee ruv-ldapi-probe-after.txt
          echo "--- ipa-a: (a) root LDAPI EXTERNAL, base-scoped read of the RUV tombstone entry ---" | tee -a ruv-ldapi-probe-after.txt
          docker exec ipa-a ldapsearch -LLL -Y EXTERNAL -H ldapi://%2Frun%2Fslapd-RUVLAB-TEST.socket -b "nsuniqueid=ffffffff-ffffffff-ffffffff-ffffffff,dc=ruvlab,dc=test" -s base "(objectclass=*)" nsds50ruv >> ruv-ldapi-probe-after.txt 2>&1 || true
          echo "--- ipa-a: (b) root LDAPI EXTERNAL, subtree search with the nsTombstone filter ---" | tee -a ruv-ldapi-probe-after.txt
          docker exec ipa-a ldapsearch -LLL -Y EXTERNAL -H ldapi://%2Frun%2Fslapd-RUVLAB-TEST.socket -b "dc=ruvlab,dc=test" -s sub "(&(nsuniqueid=ffffffff-ffffffff-ffffffff-ffffffff)(objectClass=nsTombstone))" nsds50ruv >> ruv-ldapi-probe-after.txt 2>&1 || true
          echo "--- ipa-a: (c) GSSAPI as admin, base-scoped read ---" | tee -a ruv-ldapi-probe-after.txt
          docker exec ipa-a ldapsearch -LLL -Y GSSAPI -H ldap://$(docker exec ipa-a hostname -f) -b "nsuniqueid=ffffffff-ffffffff-ffffffff-ffffffff,dc=ruvlab,dc=test" -s base "(objectclass=*)" nsds50ruv >> ruv-ldapi-probe-after.txt 2>&1 || true
          cat ruv-ldapi-probe-after.txt

      - name: THE CRITICAL TEST - run public v0.1.1 ipa-diagnose against the real stale-RUV evidence
        run: |
          echo "=== ipa-diagnose --details on the real post-removal topology ===" | tee stale-ruv-diagnose-A.txt
          docker exec ipa-a /root/.local/bin/ipa-diagnose --details > stale-ruv-diagnose-A.txt 2>&1 || true
          cat stale-ruv-diagnose-A.txt
          echo "=== ipa-diagnose --json ===" | tee stale-ruv-diagnose-A.json
          docker exec ipa-a /root/.local/bin/ipa-diagnose --json > stale-ruv-diagnose-A.json 2>&1 || true
          echo "=== overall_status extracted ==="
          grep -o '"overall_status":[^,]*' stale-ruv-diagnose-A.json || true

      - name: Verify recovery path (ipa-diagnose verify) - no cleanup performed
        run: |
          docker exec ipa-a /root/.local/bin/ipa-diagnose verify | tee stale-ruv-verify-A.txt || true

      - name: Cleanup
        if: always()
        run: |
          docker rm -f ipa-a ipa-b 2>/dev/null || true
          docker volume rm ipa-a-data ipa-b-data 2>/dev/null || true
          docker network rm ipa-net 2>/dev/null || true

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stale-ruv-live-evidence
          path: |
            server-a-install.log
            server-b-install.log
            server-b-container.log
            healthy-topology-*.txt
            healthy-topology-*.json
            stale-ruv-*.txt
            stale-ruv-*.json
            ruv-ldapi-probe-*.txt
            stale-ruv-registered-*
            stale-ruv-server-del.txt
            stale-ruv-list-host-shape.txt
            stale-ruv-list-after-del.txt
          retention-days: 30
