name: Live FreeIPA replication diagnosis

# Slice 5 live lab: three real FreeIPA servers (throwaway, created and destroyed inside this job) on a private Docker
# network, in a line topology: ipa01 (CA, DNS) -- ipa02 (CA replica) -- ipa03 (replica without CA). Domain suffix
# segments ipa01-ipa02 and ipa02-ipa03; CA suffix (o=ipaca) segment ipa01-ipa02 only.
# scripts/lab_replication.py plays the administrator: it injects ONE fault at a time, confirms it independently
# (systemctl, getent, TCP, the agreement's own status read with ldapsearch), runs ipa-diagnose replication blind on
# the relevant servers, applies only a printed fix verbatim, runs a fresh --verify, and restores the lab until every
# agreement is green again before the next scenario. A scenario without a result row is a FAIL.
# Only fake lab identities. ipa-diagnose itself never changes anything; only the lab script does.
#
# Manual: workflow_dispatch. On the development branch it also runs when .github/live-replication-trigger changes.
permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      image:
        description: "freeipa/freeipa-server image tag"
        required: false
        default: "fedora-43"
        type: string
  push:
    branches: ["slice5/replication-environment-model"]
    paths: [".github/live-replication-trigger"]

env:
  IMAGE: ${{ inputs.image || 'fedora-43' }}
  IPA_PASSWORD: LiveLabSecret123

jobs:
  replication:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Private network and the first server ipa01 (integrated DNS + CA)
        run: |
          set +e
          docker network create --subnet 172.31.0.0/24 ipanet
          for n in 1 2 3; do docker volume create ipa0$n-data; done
          docker pull freeipa/freeipa-server:$IMAGE
          docker run -d --name ipa01 --privileged --cgroupns=host \
            -v /sys/fs/cgroup:/sys/fs/cgroup:rw -v ipa01-data:/data \
            --network ipanet --ip 172.31.0.11 -h ipa01.lab.test -e PASSWORD=${IPA_PASSWORD} \
            freeipa/freeipa-server:$IMAGE \
            ipa-server-install -U -r LAB.TEST --no-ntp --skip-mem-check --setup-dns --auto-forwarders \
              --auto-reverse --ip-address=172.31.0.11
          for i in $(seq 1 120); do
            sleep 10
            if docker exec ipa01 systemctl is-active ipa.service 2>/dev/null | grep -qx active; then echo "ipa01 active after ~$((i*10))s"; sleep 20; break; fi
          done
          docker exec ipa01 ipactl status || { docker logs ipa01 2>&1 | tail -40; exit 1; }

      - name: Replica ipa02 (with CA) from ipa01
        run: python3 scripts/lab_replication.py replica ipa02 ipa01 --ca

      - name: Replica ipa03 (without CA) from ipa02
        run: python3 scripts/lab_replication.py replica ipa03 ipa02

      - name: Install ipa-diagnose (this commit) on every server
        run: |
          set -e
          for c in ipa01 ipa02 ipa03; do
            docker exec $c bash -c 'cp /etc/resolv.conf /etc/resolv.conf.lab; printf "nameserver 1.1.1.1\nnameserver 8.8.8.8\n" > /etc/resolv.conf'
            docker exec $c bash -c 'for a in 1 2 3; do dnf install -y python3-pip libfaketime && break; sleep 15; done'
            docker exec $c python3 -m pip install -q pipx
            docker cp "$GITHUB_WORKSPACE" $c:/ipa-diagnose-source
            docker exec $c python3 -m pipx install /ipa-diagnose-source
            docker exec $c bash -c 'cp /etc/resolv.conf.lab /etc/resolv.conf'
            docker exec $c /root/.local/bin/ipa-diagnose --version
          done

      - name: Record environment
        run: |
          mkdir -p out
          {
            echo "commit: $GITHUB_SHA"; echo "image: freeipa/freeipa-server:$IMAGE"
            docker exec ipa01 /root/.local/bin/ipa-diagnose --version
            for c in ipa01 ipa02 ipa03; do echo "$c: $(docker exec $c rpm -q freeipa-server 389-ds-base krb5-server | tr '\n' ' ')"; done
            docker exec ipa01 cat /etc/os-release | grep -E '^(NAME|VERSION)='
          } | tee env.txt
          echo "::notice title=replication lab environment::$(tr '\n' ' ' < env.txt)"

      - name: Prove the topology and healthy replication (row R00)
        run: python3 scripts/lab_replication.py setup

      - name: Replication scenarios (fault injection, independent confirmation, then ipa-diagnose blind)
        run: python3 scripts/lab_replication.py run

      - name: Replication assertions (fail on any FAIL or missing row)
        run: python3 scripts/lab_replication.py summary

      - name: Cleanup
        if: always()
        run: |
          docker rm -f ipa01 ipa02 ipa03 2>/dev/null || true
          for n in 1 2 3; do docker volume rm ipa0$n-data 2>/dev/null || true; done
          docker network rm ipanet 2>/dev/null || true

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-replication-evidence-${{ inputs.image || 'fedora-43' }}
          path: |
            env.txt
            out/
          retention-days: 30
