name: Post-publish check (public release, from scratch)

# Run AFTER a release is published. Uses ONLY public artifacts - production PyPI and
# the assets attached to the GitHub Release - in clean containers. No local
# candidate files are used. Verifies: PyPI version, SHA256SUMS of the published
# RPMs, the documented install commands per platform, and the key semantics of the
# DISTRIBUTED packages:
#   * ipa-healthcheck unavailable            -> UNKNOWN (exit 3)
#   * healthy replay fixture                 -> HEALTHY (exit 0)
#   * partial evidence (RUV unreadable)      -> NOT_FULLY_VERIFIED (exit 4)
#   * fully verified healthy (live path)     -> HEALTHY (exit 0)
#   * (0.1.3) only an undiagnosed finding    -> NOT_FULLY_VERIFIED (exit 4), visible in console + JSON
#   * (0.1.3) DSCERTLE0002                   -> certificate-expiry diagnosis, never an NSS DB mismatch
#   * (0.1.3) unknown future ERROR           -> NOT_FULLY_VERIFIED, not diagnosed
# The "live path" cases use tiny stand-in ipa-healthcheck / ipa-replica-manage
# scripts that print real output shapes; they test ipa-diagnose's semantics, not FreeIPA.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Released version to verify (e.g. 0.1.3)"
        required: true
        default: "0.1.3"

permissions:
  contents: read

jobs:
  pypi:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: el8,      image: "rockylinux:8",   prep: "dnf install -y python39 && python3.9 -m pip install --user pipx && export PATH=$HOME/.local/bin:$PATH"}
          - {name: el9,      image: "rockylinux:9.3", prep: "dnf install -y epel-release && dnf install -y pipx"}
          - {name: el10,     image: "almalinux:10",   prep: "dnf install -y epel-release && dnf install -y pipx"}
          - {name: fedora44, image: "fedora:44",      prep: "dnf install -y pipx"}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ inputs.version }}   # only for the replay fixtures; the package under test is from PyPI
      - name: Install from PRODUCTION PyPI with pipx (README command) and check the version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          mkdir -p logs
          docker run --rm -e VERSION -v "$PWD/tests/fixtures:/fixtures:ro" "${{ matrix.image }}" bash -c '
            set -x
            ${{ matrix.prep }}
            export PATH=$HOME/.local/bin:$PATH
            pipx install ipa-diagnose
            ipa-diagnose --version
            test "$(ipa-diagnose --version)" = "ipa-diagnose $VERSION"
            ipa-diagnose; echo "exit(no ipa-healthcheck)=$?"
            ipa-diagnose --replay /fixtures/replication/healthy | grep -q "Overall: HEALTHY" && echo "OK healthy"
            ipa-diagnose --replay /fixtures/coverage/undiagnosed-warning > /tmp/u.txt; echo "exit(undiagnosed)=$?"
            grep -q "Overall: NOT_FULLY_VERIFIED" /tmp/u.txt && grep -q "IPADNARangeCheck" /tmp/u.txt && echo "OK undiagnosed visible"
            ipa-diagnose --replay /fixtures/coverage/undiagnosed-warning --json | python3 -c "import json,sys; d=json.load(sys.stdin); assert d[\"has_undiagnosed_findings\"] and d[\"undiagnosed_count\"]==1; print(\"OK undiagnosed json\")"
            ipa-diagnose --replay /fixtures/coverage/ds-cert-expired > /tmp/d.txt; echo "exit(dscert)=$?"
            grep -q "Directory Server certificate has expired" /tmp/d.txt && ! grep -qi "NSS/TLS DB format" /tmp/d.txt && echo "OK dscert expiry"
            ipa-diagnose --replay /fixtures/coverage/future-unknown-check > /tmp/f.txt; echo "exit(future)=$?"
            grep -q "Overall: NOT_FULLY_VERIFIED" /tmp/f.txt && echo "OK future not diagnosed"
          ' 2>&1 | tee "logs/pypi-${{ matrix.name }}.log"
          grep -q "exit(no ipa-healthcheck)=3" "logs/pypi-${{ matrix.name }}.log"
          for m in "exit(undiagnosed)=4" "exit(dscert)=2" "exit(future)=4" "OK healthy" "OK undiagnosed visible" "OK undiagnosed json" "OK dscert expiry" "OK future not diagnosed"; do
            grep -qF "$m" "logs/pypi-${{ matrix.name }}.log" || { echo "MISSING: $m"; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: post-pypi-${{ matrix.name }}
          path: logs/

  rpm:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: el8,      image: "rockylinux:8",   tag: "el8",  prep: "dnf install -y python3 dnf-plugins-core python39"}
          - {name: el9,      image: "rockylinux:9.3", tag: "el9",  prep: "dnf install -y epel-release dnf-plugins-core && dnf config-manager --set-enabled crb"}
          - {name: el9-alma, image: "almalinux:9",    tag: "el9",  prep: "dnf install -y epel-release dnf-plugins-core && dnf config-manager --set-enabled crb"}
          - {name: el10,     image: "almalinux:10",   tag: "el10", prep: "dnf install -y epel-release dnf-plugins-core && dnf config-manager --set-enabled crb"}
          - {name: fedora44, image: "fedora:44",      tag: "fc44", prep: "dnf install -y dnf-plugins-core"}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ inputs.version }}   # only for the replay fixtures; the package under test is the published RPM
      - name: Download the PUBLISHED release assets and verify SHA256SUMS
        env:
          VERSION: ${{ inputs.version }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p dl logs
          base="https://github.com/${GH_REPO}/releases/download/v${VERSION}"
          curl -fsSL -o dl/SHA256SUMS "$base/SHA256SUMS"
          cat dl/SHA256SUMS
          f=$(grep -o "ipa-diagnose-${VERSION}-[^ ]*\.${{ matrix.tag }}\.[a-z0-9]*\.noarch\.rpm" dl/SHA256SUMS | head -1)
          test -n "$f"
          curl -fsSL -o "dl/$f" "$base/$f"
          ( cd dl && sha256sum -c --ignore-missing SHA256SUMS | tee ../logs/sha256-${{ matrix.name }}.txt )
          echo "$f" > dl/RPMNAME
      - name: Install the published RPM per the README and run the documented commands + semantics
        env:
          VERSION: ${{ inputs.version }}
        run: |
          cp packaging/rpm/postpublish-semantics.sh dl/postpublish-semantics.sh
          docker run --rm -e VERSION -h ipa01.example.test \
            -v "$PWD/dl:/dl:ro" -v "$PWD/tests/fixtures:/fixtures:ro" \
            "${{ matrix.image }}" bash -c '
              set -x
              ${{ matrix.prep }}
              dnf install -y "/dl/$(cat /dl/RPMNAME)"
              rpm -q ipa-diagnose
              ipa-diagnose --version
              test "$(ipa-diagnose --version)" = "ipa-diagnose $VERSION"
              ipa-diagnose --help > /dev/null
              bash /dl/postpublish-semantics.sh
              dnf remove -y ipa-diagnose
              ! rpm -q ipa-diagnose
            ' 2>&1 | tee "logs/rpm-${{ matrix.name }}.log"
          grep -q "SEMANTICS: 11 passed, 0 failed" "logs/rpm-${{ matrix.name }}.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: post-rpm-${{ matrix.name }}
          path: logs/
