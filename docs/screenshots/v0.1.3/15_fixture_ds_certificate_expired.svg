<text x="26" y="60" fill="#3fb950" font-weight="bold">FIXTURE REPLAY (NOT a live capture) - constructed upstream-shaped input replayed through the 0.1.3 code</text>
<text x="18" y="89" fill="#c9d1d9" xml:space="preserve">────────────────────────────── FreeIPA Diagnosis ───────────────────────────────</text>
<text x="18" y="106" fill="#c9d1d9" xml:space="preserve">Host: ipa01.example.test    Generated: 2026-09-20T22:24:49Z</text>
<text x="18" y="123" fill="#c9d1d9" xml:space="preserve">(replayed from fixtures: tests/fixtures/coverage/ds-cert-expired)</text>
<text x="18" y="140" fill="#ff7b72" xml:space="preserve">Overall: CRITICAL</text>
<text x="18" y="157" fill="#c9d1d9" xml:space="preserve"></text>
<text x="18" y="174" fill="#c9d1d9" xml:space="preserve">─────────────────────────────── PRIMARY PROBLEM ────────────────────────────────</text>
<text x="18" y="191" fill="#c9d1d9" xml:space="preserve">Directory Server certificate has expired</text>
<text x="18" y="208" fill="#c9d1d9" xml:space="preserve"></text>
<text x="18" y="225" fill="#c9d1d9" xml:space="preserve">WHY</text>
<text x="18" y="242" fill="#c9d1d9" xml:space="preserve">ipa-healthcheck (ipahealthcheck.ds.nss_ssl.NssCheck, lib389 certificate lint) </text>
<text x="18" y="259" fill="#c9d1d9" xml:space="preserve">directly reports that a Directory Server certificate has EXPIRED: The </text>
<text x="18" y="276" fill="#c9d1d9" xml:space="preserve">certificate (Server-Cert) has expired. This is the check&#x27;s own statement about </text>
<text x="18" y="293" fill="#c9d1d9" xml:space="preserve">the certificate, not an inference.</text>
<text x="18" y="310" fill="#c9d1d9" xml:space="preserve"></text>
<text x="18" y="327" fill="#c9d1d9" xml:space="preserve">EVIDENCE</text>
<text x="18" y="344" fill="#c9d1d9" xml:space="preserve">  ✓ ipahealthcheck.ds.nss_ssl.NssCheck reports: The certificate (Server-Cert) </text>
<text x="18" y="361" fill="#c9d1d9" xml:space="preserve">has expired</text>
<text x="18" y="378" fill="#c9d1d9" xml:space="preserve"></text>
<text x="18" y="395" fill="#c9d1d9" xml:space="preserve">IMPACT</text>
<text x="18" y="412" fill="#c9d1d9" xml:space="preserve">TLS/LDAPS connections to this Directory Server can fail or be refused by clients</text>
<text x="18" y="429" fill="#c9d1d9" xml:space="preserve">once the certificate is expired; replication and other services that bind over </text>
<text x="18" y="446" fill="#c9d1d9" xml:space="preserve">TLS may be affected.</text>
<text x="18" y="463" fill="#c9d1d9" xml:space="preserve"></text>
<text x="18" y="480" fill="#c9d1d9" xml:space="preserve">DO THIS FIRST</text>
<text x="18" y="497" fill="#c9d1d9" xml:space="preserve">List the certificates in the Directory Server NSS database and their validity </text>
<text x="18" y="514" fill="#c9d1d9" xml:space="preserve">dates.</text>
<text x="18" y="531" fill="#c9d1d9" xml:space="preserve"></text>
<text x="18" y="548" fill="#c9d1d9" xml:space="preserve">    certutil -L -d /etc/dirsrv/slapd-&lt;INSTANCE&gt;</text>
<text x="18" y="565" fill="#c9d1d9" xml:space="preserve"></text>
<text x="18" y="582" fill="#c9d1d9" xml:space="preserve">Safety: SAFE — read-only, no state change.</text>
<text x="18" y="599" fill="#c9d1d9" xml:space="preserve"></text>
<text x="18" y="616" fill="#c9d1d9" xml:space="preserve">1 additional step(s) - see --details.</text>
<text x="18" y="633" fill="#c9d1d9" xml:space="preserve"></text>
<text x="18" y="650" fill="#c9d1d9" xml:space="preserve">VERIFY</text>
<text x="18" y="667" fill="#c9d1d9" xml:space="preserve">After addressing this, confirm with:</text>
<text x="18" y="684" fill="#c9d1d9" xml:space="preserve"></text>
<text x="18" y="701" fill="#c9d1d9" xml:space="preserve">    sudo ipa-diagnose verify</text>
<text x="18" y="718" fill="#c9d1d9" xml:space="preserve"></text>
<text x="18" y="735" fill="#c9d1d9" xml:space="preserve"></text>
<text x="18" y="752" fill="#c9d1d9" xml:space="preserve">────────────────────────────────────────────────────────────────────────────────</text>
<text x="18" y="769" fill="#c9d1d9" xml:space="preserve">Diagnostic packs evaluated: directory-server, dns, kerberos, replication, </text>
<text x="18" y="786" fill="#c9d1d9" xml:space="preserve">certificates</text>
