<text x="76" y="22" fill="#8b949e">Real CS.cfg mode finding (DEGRADED) with undiagnosed findings listed after it</text>
<rect x="18" y="44" width="1134" height="22" rx="4" fill="#12261e"/>
<text x="26" y="60" fill="#3fb950" font-weight="bold">REAL LIVE CAPTURE - FreeIPA 4.13.3 / Fedora 43 / ipa-healthcheck 0.19 on a free GitHub runner, ipa-diagnose 0.1.3 candidate 9860e98</text>
<text x="18" y="89" fill="#c9d1d9" xml:space="preserve">────────────────────────────── FreeIPA Diagnosis ───────────────────────────────</text>
<text x="18" y="106" fill="#c9d1d9" xml:space="preserve">Host: ipa01.lab.test    Generated: 2026-09-20T23:18:10Z</text>
<text x="18" y="123" fill="#d29922" xml:space="preserve">Overall: DEGRADED</text>
<text x="18" y="140" fill="#c9d1d9" xml:space="preserve"></text>
<text x="18" y="157" fill="#c9d1d9" xml:space="preserve">─────────────────────────────── PRIMARY PROBLEM ────────────────────────────────</text>
<text x="18" y="174" fill="#ff7b72" xml:space="preserve">File ownership/mode mismatch on an IPA-managed security-critical file</text>
<text x="18" y="191" fill="#c9d1d9" xml:space="preserve"></text>
<text x="18" y="208" fill="#c9d1d9" xml:space="preserve">WHY</text>
<text x="18" y="225" fill="#c9d1d9" xml:space="preserve">ipa-healthcheck&#x27;s ipahealthcheck.ipa.files.TomcatFileCheck directly reports an </text>
<text x="18" y="242" fill="#ff7b72" xml:space="preserve">incorrect owner, group, or mode on a security-critical file: Permissions of </text>
<text x="18" y="259" fill="#c9d1d9" xml:space="preserve">/var/lib/pki/pki-tomcat/conf/ca/CS.cfg are too permissive: 0664 and should be </text>
<text x="18" y="276" fill="#c9d1d9" xml:space="preserve">0660. This finding is itself direct evidence of a plain Unix </text>
<text x="18" y="293" fill="#c9d1d9" xml:space="preserve">ownership/permissions problem, independent of whether SELinux is also involved.</text>
<text x="18" y="310" fill="#c9d1d9" xml:space="preserve"></text>
<text x="18" y="327" fill="#c9d1d9" xml:space="preserve">EVIDENCE</text>
<text x="18" y="344" fill="#c9d1d9" xml:space="preserve">  ✓ ipahealthcheck.ipa.files.TomcatFileCheck reports a file ownership/mode </text>
<text x="18" y="361" fill="#c9d1d9" xml:space="preserve">problem: Permissions of /var/lib/pki/pki-tomcat/conf/ca/CS.cfg are too </text>
<text x="18" y="378" fill="#c9d1d9" xml:space="preserve">permissive: 0664 and should be 0660</text>
<text x="18" y="395" fill="#c9d1d9" xml:space="preserve"></text>
<text x="18" y="412" fill="#c9d1d9" xml:space="preserve">IMPACT</text>
<text x="18" y="429" fill="#c9d1d9" xml:space="preserve">dirsrv (or the RA agent / Tomcat/PKI NSS DB it depends on) can fail to start or </text>
<text x="18" y="446" fill="#c9d1d9" xml:space="preserve">fail to read its own certificate material until ownership/mode is corrected.</text>
<text x="18" y="463" fill="#c9d1d9" xml:space="preserve"></text>
<text x="18" y="480" fill="#c9d1d9" xml:space="preserve">DO THIS FIRST</text>
<text x="18" y="497" fill="#c9d1d9" xml:space="preserve">Confirm the current owner/group/mode and SELinux context of the reported path </text>
<text x="18" y="514" fill="#c9d1d9" xml:space="preserve">before changing anything.</text>
<text x="18" y="531" fill="#c9d1d9" xml:space="preserve"></text>
<text x="18" y="548" fill="#c9d1d9" xml:space="preserve">    ls -lZ &lt;path-from-finding&gt;</text>
<text x="18" y="565" fill="#c9d1d9" xml:space="preserve"></text>
<text x="18" y="582" fill="#c9d1d9" xml:space="preserve">Safety: SAFE — read-only, no state change.</text>
<text x="18" y="599" fill="#c9d1d9" xml:space="preserve"></text>
<text x="18" y="616" fill="#c9d1d9" xml:space="preserve">ADDITIONAL ACTIONS</text>
<text x="18" y="633" fill="#c9d1d9" xml:space="preserve">  - chown/chmod the file to the owner:group:mode ipa-healthcheck reports as </text>
<text x="18" y="650" fill="#c9d1d9" xml:space="preserve">correct.</text>
<text x="18" y="667" fill="#c9d1d9" xml:space="preserve">      chown &lt;expected-owner&gt;:&lt;expected-group&gt; &lt;path&gt;; chmod &lt;expected-mode&gt; </text>
<text x="18" y="684" fill="#c9d1d9" xml:space="preserve">&lt;path&gt;</text>
<text x="18" y="701" fill="#c9d1d9" xml:space="preserve">    Safety: CAUTION — changes state, but is reversible and scoped.</text>
<text x="18" y="718" fill="#c9d1d9" xml:space="preserve">  - If SELinux is enforcing, also restore the expected SELinux context on that </text>
<text x="18" y="735" fill="#c9d1d9" xml:space="preserve">same path (do not run this fleet-wide).</text>
<text x="18" y="752" fill="#c9d1d9" xml:space="preserve">      restorecon -Rv &lt;path&gt;</text>
<text x="18" y="769" fill="#c9d1d9" xml:space="preserve">    Safety: CAUTION — changes state, but is reversible and scoped.</text>
<text x="18" y="786" fill="#c9d1d9" xml:space="preserve"></text>
<text x="18" y="803" fill="#c9d1d9" xml:space="preserve">CONFIDENCE</text>
<text x="18" y="820" fill="#c9d1d9" xml:space="preserve">MEDIUM: [HIGH, ipa-healthcheck&#x27;s IPAFileCheck/IPAFileNSSDBCheck/TomcatFileCheck </text>
<text x="18" y="837" fill="#c9d1d9" xml:space="preserve">compare against documented owner:group:mode targets] the healthcheck finding is </text>
<text x="18" y="854" fill="#c9d1d9" xml:space="preserve">direct evidence of the exact wrong value.</text>
<text x="18" y="871" fill="#c9d1d9" xml:space="preserve"></text>
<text x="18" y="888" fill="#c9d1d9" xml:space="preserve">LIMITATIONS</text>
<text x="18" y="905" fill="#c9d1d9" xml:space="preserve">This pack has no ausearch/AVC collector; &#x27;no new AVC denials&#x27; can only be </text>
<text x="18" y="922" fill="#c9d1d9" xml:space="preserve">confirmed by the administrator via `ausearch -m avc -ts recent`, not by this </text>
<text x="18" y="939" fill="#c9d1d9" xml:space="preserve">tool.</text>
<text x="18" y="956" fill="#c9d1d9" xml:space="preserve"></text>
<text x="18" y="973" fill="#c9d1d9" xml:space="preserve">VERIFY</text>
<text x="18" y="990" fill="#c9d1d9" xml:space="preserve">After addressing this, confirm with:</text>
<text x="18" y="1007" fill="#c9d1d9" xml:space="preserve"></text>
<text x="18" y="1024" fill="#c9d1d9" xml:space="preserve">    sudo ipa-diagnose verify</text>
<text x="18" y="1041" fill="#c9d1d9" xml:space="preserve"></text>
<text x="18" y="1058" fill="#c9d1d9" xml:space="preserve">  - Confirm dirsrv actually starts (not just that `ls -lZ` shows corrected </text>
<text x="18" y="1075" fill="#c9d1d9" xml:space="preserve">labels), and that no new AVC denials appear in journalctl in a subsequent </text>
<text x="18" y="1092" fill="#c9d1d9" xml:space="preserve">window.</text>
<text x="18" y="1109" fill="#c9d1d9" xml:space="preserve"></text>
<text x="18" y="1126" fill="#c9d1d9" xml:space="preserve">───────────────────── UNDIAGNOSED ipa-healthcheck FINDINGS ─────────────────────</text>
<text x="18" y="1143" fill="#c9d1d9" xml:space="preserve">1 finding(s) not explained by any ipa-diagnose rule. That does not mean they are</text>
<text x="18" y="1160" fill="#c9d1d9" xml:space="preserve">harmless - review them with ipa-healthcheck. No cause is claimed.</text>
<text x="18" y="1177" fill="#c9d1d9" xml:space="preserve">  • [WARNING] ipahealthcheck.meta.core.MetaCheck: (no message; fields: key, </text>
<text x="18" y="1194" fill="#c9d1d9" xml:space="preserve">fqdn, fips, acme, ipa_version, ipa_api_version) - meta</text>
<text x="18" y="1211" fill="#c9d1d9" xml:space="preserve">    check available since ipa-healthcheck 0.2; installed ipa-healthcheck </text>
<text x="18" y="1228" fill="#c9d1d9" xml:space="preserve">0.19-2.fc43</text>
<text x="18" y="1245" fill="#c9d1d9" xml:space="preserve"></text>
<text x="18" y="1262" fill="#c9d1d9" xml:space="preserve">────────────────────────────────────────────────────────────────────────────────</text>
