[build-system]
# >=77 is required for the PEP 639 SPDX-string `license = "Apache-2.0"` form
# used below; setuptools 68 only understands the older `license = {text = ...}`
# table and fails with a confusing metadata error otherwise (found in review -
# the project only built successfully so far because Docker resolved a much
# newer setuptools than this pin actually promised).
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ipa-diagnose"
version = "0.1.3"
description = "Evidence-grounded diagnostic and correlation engine for FreeIPA / Red Hat IdM administrators"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
authors = [{ name = "ipa-diagnose contributors" }]
keywords = ["freeipa", "ipa", "identity-management", "kerberos", "ldap", "diagnostics", "sysadmin"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Systems Administration",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = [
    "rich>=13.7,<15",
]

[project.optional-dependencies]
openai = ["openai>=1.40,<2"]
anthropic = ["anthropic>=0.34,<1"]
bedrock = ["boto3>=1.34,<2"]
ai = ["ipa-diagnose[openai,anthropic,bedrock]"]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<6",
]
# cairosvg is intentionally NOT a declared extra: it's only used by
# scripts/capture_screenshots.py (SVG -> PNG conversion) and pulling it into
# the "dev" extra would make it an RPM %check build-dependency for no
# benefit to the actual test suite. Install ad hoc: pip install cairosvg.

[project.urls]
Homepage = "https://github.com/InfraGuard-Labs/ipa-diagnose"
Issues = "https://github.com/InfraGuard-Labs/ipa-diagnose/issues"

[project.scripts]
ipa-diagnose = "ipa_diagnose.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ipa_diagnose = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
